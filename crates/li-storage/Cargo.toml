[package]
name = "li-storage"
version = "0.2.0"
edition = "2024"

[features]
default = ["rocksdb"]
rocksdb = ["dep:rocksdb"]

[dependencies]
li-core = { path = "../li-core", version = "0.2.0" }
hashbrown = { version = "0.17", features = ["serde"] }
rocksdb = { version = "0.24", optional = true }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1", features = ["use-std"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
bytes = "1.10"
tempfile = "3.27"
