[package]
name = "li-storage"
version = "0.1.0"
edition = "2024"

[features]
default = ["std"]
std = ["serde/std", "dep:rocksdb"]
no-std = []

[dependencies]
li-core = { path = "../li-core", version = "0.1.0" }
li-model = { path = "../li-model", version = "0.1.0" }
li-workspace = { path = "../li-workspace", version = "0.1.0" }
rocksdb = { version = "0.24", optional = true }
serde = { version = "1", features = ["derive", "alloc"] }
postcard = { version = "1.1", features = ["alloc"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3.27"
