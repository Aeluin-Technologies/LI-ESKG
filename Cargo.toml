[workspace]
members = [
    "crates/li-core",
    "crates/li-factors",
    "crates/li-inference",
    "crates/li-model",
    "crates/li-runtime",
    "crates/li-storage",
    "crates/li-workspace",
    "python"
]
resolver = "2"

[workspace.dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[profile.bench]
lto = true
